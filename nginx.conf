events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Masquer la version Nginx
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header X-XSS-Protection          "0"                                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content-Security-Policy — ajuster si des domaines tiers sont nécessaires
        add_header Content-Security-Policy "
            default-src 'self';
            script-src  'self' 'unsafe-inline' https://api.touchpay.bj;
            style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src    'self' https://fonts.gstatic.com;
            img-src     'self' data: https://minio.innovimpactdev.cloud https://minio.secure.innovimpactdev.cloud;
            connect-src 'self' https://api.bdy.innovimpactdev.cloud https://pay.wave.com;
            frame-src   'none';
            object-src  'none';
            base-uri    'self';
            form-action 'self';
        " always;

        # ── Routes SPA ────────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Assets statiques avec cache long ─────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Répéter les security headers (add_header n'hérite pas dans les blocs location)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY"    always;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Bloquer l'accès aux fichiers sensibles ───────────────────────────
        location ~ /\.(env|git|htaccess|DS_Store) {
            deny all;
            return 404;
        }
    }
}
