<div class="min-h-screen bg-[#F4F6F9]">

  <!-- ── En-tête ─────────────────────────────────────────────────────── -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight text-[#191B23] sm:text-3xl">
      Demande de matériels
    </h1>
    <p class="mt-1 text-sm text-[#747686]">
      Suivez et consultez les appels d'offre en cours pour le matériel médical
    </p>
  </div>

  <!-- ── Filtres ──────────────────────────────────────────────────────── -->
  <div class="mb-8 flex items-center gap-3">
    <button
      *ngFor="let f of filters"
      type="button"
      (click)="setFilter(f)"
      class="rounded-full px-5 py-2 text-sm font-medium transition-colors duration-200"
      [ngClass]="activeFilter === f
        ? 'bg-[#104382] text-white shadow-sm'
        : 'bg-transparent text-[#747686] hover:text-[#191B23]'">
      {{ f }}
    </button>
  </div>

  <!-- ── Grille de cartes ─────────────────────────────────────────────── -->
  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">

    <div
      *ngFor="let d of filteredDemandes"
      class="flex flex-col rounded-2xl bg-white p-5 shadow-sm border border-slate-100 transition-shadow hover:shadow-md">

      <!-- Identité hôpital -->
      <div class="flex items-start justify-between gap-3">

        <!-- Icône + Infos -->
        <div class="flex items-center gap-3">
          <!-- Icon container -->
          <div
            class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
            [ngClass]="iconBgClass(d.iconKey)">

            <!-- Hospital cross icon -->
            <svg *ngIf="d.iconKey === 'hospital'" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M7.5 14H10.5V10.5H14V7.5H10.5V4H7.5V7.5H4V10.5H7.5V14ZM2 18C1.45 18 0.979167 17.8042 0.5875 17.4125C0.195833 17.0208 0 16.55 0 16V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H16C16.55 0 17.0208 0.195833 17.4125 0.5875C17.8042 0.979167 18 1.45 18 2V16C18 16.55 17.8042 17.0208 17.4125 17.4125C17.0208 17.8042 16.55 18 16 18H2Z" fill="#11458B"/>
</svg>

            <!-- Star (clinique) icon -->
            <svg *ngIf="d.iconKey === 'star'" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M6.9 18V12.05L1.75 15.025L0 12L5.15 9L0 6.025L1.75 3L6.9 5.975V0H10.4V5.975L15.55 3L17.3 6.025L12.15 9L17.3 12L15.55 15.025L10.4 12.05V18H6.9Z" fill="#006E2A"/>
</svg>

            <!-- Lab microscope icon -->
            <svg *ngIf="d.iconKey === 'lab'" width="14" height="19" viewBox="0 0 14 19" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M0 19V17H5V15C3.61667 15 2.4375 14.5125 1.4625 13.5375C0.4875 12.5625 0 11.3833 0 10C0 9.05 0.241667 8.175 0.725 7.375C1.20833 6.575 1.875 5.96667 2.725 5.55C2.65833 5.91667 2.67083 6.275 2.7625 6.625C2.85417 6.975 3 7.30833 3.2 7.625C2.81667 7.89167 2.52083 8.23333 2.3125 8.65C2.10417 9.06667 2 9.51667 2 10C2 10.8333 2.29167 11.5417 2.875 12.125C3.45833 12.7083 4.16667 13 5 13H13V15H8V17H14V19H0ZM9 10.1L8.7 9.15L7.75 9.5L7.25 8.175C7.58333 7.90833 7.84167 7.5875 8.025 7.2125C8.20833 6.8375 8.3 6.43333 8.3 6C8.3 5.21667 8.025 4.55417 7.475 4.0125C6.925 3.47083 6.25 3.2 5.45 3.2L5 1.95L5.95 1.6L5.6 0.7L7.5 0L7.8 0.95L8.75 0.6L11.5 8.1L10.55 8.45L10.9 9.4L9 10.1ZM5.5 7.8C5 7.8 4.575 7.625 4.225 7.275C3.875 6.925 3.7 6.5 3.7 6C3.7 5.5 3.875 5.075 4.225 4.725C4.575 4.375 5 4.2 5.5 4.2C6 4.2 6.425 4.375 6.775 4.725C7.125 5.075 7.3 5.5 7.3 6C7.3 6.5 7.125 6.925 6.775 7.275C6.425 7.625 6 7.8 5.5 7.8Z" fill="#791C00"/>
</svg>

          </div>

          <!-- Name & category -->
          <div class="min-w-0">
            <p class="truncate text-sm sm:text-base font-semibold text-[#191B23]">{{ d.hopital }}</p>
            <p class="mt-0.5 truncate text-xs sm:text-sm text-[#747686]">{{ d.categorie }}</p>
          </div>
        </div>

        <!-- Status badge -->
        <span
          class="shrink-0 rounded-full px-2.5 py-0.5 text-[11px] font-semibold"
          [ngClass]="statusBadgeClass(d.status)">
          {{ d.status }}
        </span>
      </div>

      <!-- Méta : Échéance + Produits -->
      <div class="mt-5 grid grid-cols-2 gap-4">
        <div>
          <p class="text-[11px] uppercase tracking-wide text-[#94A3B8]">Échéance</p>
          <p class="mt-1 text-base font-bold text-[#104382]">{{ d.echeance }}</p>
        </div>
        <div>
          <p class="text-[11px] uppercase tracking-wide text-[#94A3B8]">Produits demandés</p>
          <p class="mt-1 text-base font-bold text-[#191B23]">{{ d.produitsCount }}</p>
        </div>
      </div>

      <!-- CTA -->
      <button
        type="button"
        (click)="openDetail(d.id)"
        class="mt-5 w-full rounded-xl border border-[#104382] py-2.5 text-sm font-semibold text-[#104382] transition-colors hover:bg-[#EEF4FF]">
        Voir détail
      </button>
    </div>

  </div>

</div>
