<div class="min-h-screen bg-[#F4F6F9] ">
  <div class="mx-auto max-w-[1200px]">

    <!-- Header -->
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
      <div class="flex items-start gap-4">
        <button (click)="back()"
          class="mt-1 flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-white hover:bg-slate-50">
         <svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M16.75 6.75H0.75M6.75 12.75L0.75 6.75L6.75 0.75" stroke="#2B3674" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
        </button>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A] sm:text-3xl">
            {{ detail?.titre ?? '—' }}
          </h1>
          <p class="mt-1 text-sm text-[#64748B]">{{ detail?.description }}</p>
        </div>
      </div>

      <button
        class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-[#124A92] px-5 py-3 text-[15px] font-semibold text-white transition hover:bg-[#0F3E79]">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14" />
        </svg>
        Nouvelle demande
      </button>
    </div>

    <!-- KPI row -->
    <div class="mb-8 grid gap-5 sm:grid-cols-2 xl:grid-cols-4">

      <div *ngFor="let kpi of kpis" class="flex items-center gap-4 rounded-xl bg-white px-5 py-5 ring-1 ring-slate-100">

        <!-- Icône -->
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
          [ngClass]="[kpi.iconBg, kpi.iconColor]">
          <ng-container [ngSwitch]="kpi.id">

            <svg *ngSwitchCase="'devis'" width="16" height="20" viewBox="0 0 16 20" fill="none">
              <path
                d="M4 16H12V14H4V16ZM4 12H12V10H4V12ZM2 20C1.45 20 0.979167 19.8042 0.5875 19.4125C0.195833 19.0208 0 18.55 0 18V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H10L16 6V18C16 18.55 15.8042 19.0208 15.4125 19.4125C15.0208 19.8042 14.55 20 14 20H2ZM9 7V2H2V18H14V7H9ZM2 2V7V2V7V18V2Z"
                fill="currentColor" />
            </svg>

            <svg *ngSwitchCase="'prix'" width="22" height="16" viewBox="0 0 22 16" fill="none">
              <path
                d="M13 9C12.1667 9 11.4583 8.70833 10.875 8.125C10.2917 7.54167 10 6.83333 10 6C10 5.16667 10.2917 4.45833 10.875 3.875C11.4583 3.29167 12.1667 3 13 3C13.8333 3 14.5417 3.29167 15.125 3.875C15.7083 4.45833 16 5.16667 16 6C16 6.83333 15.7083 7.54167 15.125 8.125C14.5417 8.70833 13.8333 9 13 9ZM6 12C5.45 12 4.97917 11.8042 4.5875 11.4125C4.19583 11.0208 4 10.55 4 10V2C4 1.45 4.19583 0.979167 4.5875 0.5875C4.97917 0.195833 5.45 0 6 0H20C20.55 0 21.0208 0.195833 21.4125 0.5875C21.8042 0.979167 22 1.45 22 2V10C22 10.55 21.8042 11.0208 21.4125 11.4125C21.0208 11.8042 20.55 12 20 12H6ZM8 10H18C18 9.45 18.1958 8.97917 18.5875 8.5875C18.9792 8.19583 19.45 8 20 8V4C19.45 4 18.9792 3.80417 18.5875 3.4125C18.1958 3.02083 18 2.55 18 2H8C8 2.55 7.80417 3.02083 7.4125 3.4125C7.02083 3.80417 6.55 4 6 4V8C6.55 8 7.02083 8.19583 7.4125 8.5875C7.80417 8.97917 8 9.45 8 10ZM19 16H2C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V3H2V14H19V16ZM6 10V2V10Z"
                fill="currentColor" />
            </svg>

            <svg *ngSwitchCase="'delai'" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path
                d="M13.3 14.7L14.7 13.3L11 9.6V5H9V10.4L13.3 14.7ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20ZM10 18C12.2167 18 14.1042 17.2208 15.6625 15.6625C17.2208 14.1042 18 12.2167 18 10C18 7.78333 17.2208 5.89583 15.6625 4.3375C14.1042 2.77917 12.2167 2 10 2C7.78333 2 5.89583 2.77917 4.3375 4.3375C2.77917 5.89583 2 7.78333 2 10C2 12.2167 2.77917 14.1042 4.3375 15.6625C5.89583 17.2208 7.78333 18 10 18Z"
                fill="currentColor" />
            </svg>

            <svg *ngSwitchCase="'echeance'" width="18" height="20" viewBox="0 0 18 20" fill="none">
              <path
                d="M11.5 16C10.8 16 10.2083 15.7583 9.725 15.275C9.24167 14.7917 9 14.2 9 13.5C9 12.8 9.24167 12.2083 9.725 11.725C10.2083 11.2417 10.8 11 11.5 11C12.2 11 12.7917 11.2417 13.275 11.725C13.7583 12.2083 14 12.8 14 13.5C14 14.2 13.7583 14.7917 13.275 15.275C12.7917 15.7583 12.2 16 11.5 16ZM2 20C1.45 20 0.979167 19.8042 0.5875 19.4125C0.195833 19.0208 0 18.55 0 18V4C0 3.45 0.195833 2.97917 0.5875 2.5875C0.979167 2.19583 1.45 2 2 2H3V0H5V2H13V0H15V2H16C16.55 2 17.0208 2.19583 17.4125 2.5875C17.8042 2.97917 18 3.45 18 4V18C18 18.55 17.8042 19.0208 17.4125 19.4125C17.0208 19.8042 16.55 20 16 20H2ZM2 18H16V8H2V18ZM2 6H16V4H2V6ZM2 6V4V6Z"
                fill="currentColor" />
            </svg>

          </ng-container>
        </span>

        <!-- Valeur -->
        <div>
          <p class="text-sm sm:text-base uppercase tracking-widest text-[#434655]">{{ kpi.label }}</p>
          <p class="mt-0.5 text-2xl font-semibold text-[#191B23]">{{ kpi.value }}</p>
        </div>

      </div>

    </div>

    <!-- Filtres + tri -->
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between rounded-lg bg-white p-3">
      <div class="flex flex-wrap gap-3">
        <button
          class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-[#475569] transition hover:bg-slate-50">
          <svg width="14" height="9" viewBox="0 0 14 9" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.25 9V7.5H8.25V9H5.25ZM2.25 5.25V3.75H11.25V5.25H2.25ZM0 1.5V0H13.5V1.5H0Z" fill="#191B23" />
          </svg>
          Filtrer par Prix
        </button>
        <button
          class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-[#475569] transition hover:bg-slate-50">
          <svg width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M5.7 15.75L4.275 13.35L1.575 12.75L1.8375 9.975L0 7.875L1.8375 5.775L1.575 3L4.275 2.4L5.7 0L8.25 1.0875L10.8 0L12.225 2.4L14.925 3L14.6625 5.775L16.5 7.875L14.6625 9.975L14.925 12.75L12.225 13.35L10.8 15.75L8.25 14.6625L5.7 15.75ZM6.3375 13.8375L8.25 13.0125L10.2 13.8375L11.25 12.0375L13.3125 11.55L13.125 9.45L14.5125 7.875L13.125 6.2625L13.3125 4.1625L11.25 3.7125L10.1625 1.9125L8.25 2.7375L6.3 1.9125L5.25 3.7125L3.1875 4.1625L3.375 6.2625L1.9875 7.875L3.375 9.45L3.1875 11.5875L5.25 12.0375L6.3375 13.8375ZM7.4625 10.5375L11.7 6.3L10.65 5.2125L7.4625 8.4L5.85 6.825L4.8 7.875L7.4625 10.5375Z"
              fill="#191B23" />
          </svg>
          Fournisseurs Agréés
        </button>
      </div>
      <p class="text-sm text-[#94A3B8]">
        Trier par : <span class="text-[#00339E]">Pertinence</span>
      </p>
    </div>

    <!-- Cartes fournisseurs -->
    <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
      <article *ngFor="let f of detail?.fournisseurs"
        class="flex flex-col rounded-2xl bg-white p-6 ring-1 ring-slate-100 transition hover:shadow-sm">

        <!-- Nom + note -->
        <div>
          <h2 class="text-lg sm:text-xl font-semibold text-[#191B23]">{{ f.nom }}</h2>
          <div class="mt-1 flex items-center gap-1.5 text-sm">
            <svg class="h-4 w-4 text-[#006E2A]" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
            </svg>
            <span class="font-semibold text-[#006E2A]">{{ f.note }}</span>
            <span class="text-[#747686]">({{ f.avis }} avis)</span>
          </div>
        </div>

        <!-- Prix + délai -->
        <div class="mt-4 grid grid-cols-2 gap-3">
          <div class="rounded-xl bg-[#F2F2F2] px-4 py-3">
            <p class="text-[10px] uppercase tracking-widest text-[#434655]">Prix total</p>
            <p class="mt-1 text-base sm:text-lg font-sembold text-[#00339E]">{{ f.prixTotal }}</p>
          </div>
          <div class="rounded-xl bg-[#F2F2F2] px-4 py-3">
            <p class="text-[10px] uppercase tracking-widest text-[#434655]">Délai livraison</p>
            <p class="mt-1 text-xl font-semibold text-[#0F172A]">{{ f.delaiLivraison }}</p>
          </div>
        </div>

        <!-- Date + statut -->
        <div class="mt-4 space-y-2.5 text-sm">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-[#64748B]">
              <svg width="14" height="15" viewBox="0 0 14 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M1.5 15C1.0875 15 0.734375 14.8531 0.440625 14.5594C0.146875 14.2656 0 13.9125 0 13.5V3C0 2.5875 0.146875 2.23438 0.440625 1.94062C0.734375 1.64687 1.0875 1.5 1.5 1.5H2.25V0H3.75V1.5H9.75V0H11.25V1.5H12C12.4125 1.5 12.7656 1.64687 13.0594 1.94062C13.3531 2.23438 13.5 2.5875 13.5 3V13.5C13.5 13.9125 13.3531 14.2656 13.0594 14.5594C12.7656 14.8531 12.4125 15 12 15H1.5ZM1.5 13.5H12V6H1.5V13.5ZM1.5 4.5H12V3H1.5V4.5ZM1.5 4.5V3V4.5Z"
                  fill="#434655" />
              </svg>
              Reçu le
            </div>
            <span class="font-semibold text-[#0F172A]">{{ f.dateReception }}</span>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-[#64748B]">
              <!-- icône check -->
              <ng-container *ngIf="statutIconType(f.statut) === 'check'">
                <svg width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M5.7 15.75L4.275 13.35L1.575 12.75L1.8375 9.975L0 7.875L1.8375 5.775L1.575 3L4.275 2.4L5.7 0L8.25 1.0875L10.8 0L12.225 2.4L14.925 3L14.6625 5.775L16.5 7.875L14.6625 9.975L14.925 12.75L12.225 13.35L10.8 15.75L8.25 14.6625L5.7 15.75ZM6.3375 13.8375L8.25 13.0125L10.2 13.8375L11.25 12.0375L13.3125 11.55L13.125 9.45L14.5125 7.875L13.125 6.2625L13.3125 4.1625L11.25 3.7125L10.1625 1.9125L8.25 2.7375L6.3 1.9125L5.25 3.7125L3.1875 4.1625L3.375 6.2625L1.9875 7.875L3.375 9.45L3.1875 11.5875L5.25 12.0375L6.3375 13.8375ZM7.4625 10.5375L11.7 6.3L10.65 5.2125L7.4625 8.4L5.85 6.825L4.8 7.875L7.4625 10.5375Z"
                    fill="#434655" />
                </svg>
              </ng-container>
              <!-- icône clock -->
              <ng-container *ngIf="statutIconType(f.statut) === 'clock'">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M3.75 8.625C4.0625 8.625 4.32812 8.51562 4.54688 8.29688C4.76562 8.07812 4.875 7.8125 4.875 7.5C4.875 7.1875 4.76562 6.92188 4.54688 6.70312C4.32812 6.48438 4.0625 6.375 3.75 6.375C3.4375 6.375 3.17188 6.48438 2.95312 6.70312C2.73438 6.92188 2.625 7.1875 2.625 7.5C2.625 7.8125 2.73438 8.07812 2.95312 8.29688C3.17188 8.51562 3.4375 8.625 3.75 8.625ZM7.5 8.625C7.8125 8.625 8.07812 8.51562 8.29688 8.29688C8.51562 8.07812 8.625 7.8125 8.625 7.5C8.625 7.1875 8.51562 6.92188 8.29688 6.70312C8.07812 6.48438 7.8125 6.375 7.5 6.375C7.1875 6.375 6.92188 6.48438 6.70312 6.70312C6.48438 6.92188 6.375 7.1875 6.375 7.5C6.375 7.8125 6.48438 8.07812 6.70312 8.29688C6.92188 8.51562 7.1875 8.625 7.5 8.625ZM11.25 8.625C11.5625 8.625 11.8281 8.51562 12.0469 8.29688C12.2656 8.07812 12.375 7.8125 12.375 7.5C12.375 7.1875 12.2656 6.92188 12.0469 6.70312C11.8281 6.48438 11.5625 6.375 11.25 6.375C10.9375 6.375 10.6719 6.48438 10.4531 6.70312C10.2344 6.92188 10.125 7.1875 10.125 7.5C10.125 7.8125 10.2344 8.07812 10.4531 8.29688C10.6719 8.51562 10.9375 8.625 11.25 8.625ZM7.5 15C6.4625 15 5.4875 14.8031 4.575 14.4094C3.6625 14.0156 2.86875 13.4812 2.19375 12.8062C1.51875 12.1312 0.984375 11.3375 0.590625 10.425C0.196875 9.5125 0 8.5375 0 7.5C0 6.4625 0.196875 5.4875 0.590625 4.575C0.984375 3.6625 1.51875 2.86875 2.19375 2.19375C2.86875 1.51875 3.6625 0.984375 4.575 0.590625C5.4875 0.196875 6.4625 0 7.5 0C8.5375 0 9.5125 0.196875 10.425 0.590625C11.3375 0.984375 12.1312 1.51875 12.8062 2.19375C13.4812 2.86875 14.0156 3.6625 14.4094 4.575C14.8031 5.4875 15 6.4625 15 7.5C15 8.5375 14.8031 9.5125 14.4094 10.425C14.0156 11.3375 13.4812 12.1312 12.8062 12.8062C12.1312 13.4812 11.3375 14.0156 10.425 14.4094C9.5125 14.8031 8.5375 15 7.5 15ZM7.5 13.5C9.175 13.5 10.5938 12.9188 11.7563 11.7563C12.9188 10.5938 13.5 9.175 13.5 7.5C13.5 5.825 12.9188 4.40625 11.7563 3.24375C10.5938 2.08125 9.175 1.5 7.5 1.5C5.825 1.5 4.40625 2.08125 3.24375 3.24375C2.08125 4.40625 1.5 5.825 1.5 7.5C1.5 9.175 2.08125 10.5938 3.24375 11.7563C4.40625 12.9188 5.825 13.5 7.5 13.5Z"
                    fill="#434655" />
                </svg>
              </ng-container>
              <!-- icône warning -->
              <ng-container *ngIf="statutIconType(f.statut) === 'warning'">
                <svg width="3" height="14" viewBox="0 0 3 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M1.5 13.5C1.0875 13.5 0.734375 13.3531 0.440625 13.0594C0.146875 12.7656 0 12.4125 0 12C0 11.5875 0.146875 11.2344 0.440625 10.9406C0.734375 10.6469 1.0875 10.5 1.5 10.5C1.9125 10.5 2.26562 10.6469 2.55938 10.9406C2.85313 11.2344 3 11.5875 3 12C3 12.4125 2.85313 12.7656 2.55938 13.0594C2.26562 13.3531 1.9125 13.5 1.5 13.5ZM0 9V0H3V9H0Z"
                    fill="#434655" />
                </svg>
              </ng-container>
              Statut
            </div>
            <span class="font-semibold" [ngClass]="statutClass(f.statut)">{{ f.statut }}</span>
          </div>
        </div>

        <!-- Bouton voir détail -->
        <button (click)="openDevis(f.slug)"
          class="mt-5 flex w-full items-center justify-center gap-2 rounded-xl border border-[#00339E] py-3 text-sm font-bold text-[#00339E] transition hover:bg-[#EFF6FF]">
          Voir détail
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>

      </article>
    </div>

  </div>
</div>
