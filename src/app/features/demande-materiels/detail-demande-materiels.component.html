<div class="min-h-screen bg-[#F4F6F9] ">
  <div class="mx-auto max-w-[1200px]">

    <!-- Header -->
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
      <div class="flex items-start gap-4">
        <button (click)="back()"
          class="mt-1 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-white ring-1 ring-slate-200 transition hover:bg-slate-50">
          <svg class="h-4 w-4 text-[#475569]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A] sm:text-[28px]">
            {{ detail?.titre ?? '—' }}
          </h1>
          <p class="mt-1 text-sm text-[#64748B]">{{ detail?.description }}</p>
        </div>
      </div>

      <button
        class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-[#124A92] px-5 py-3 text-[15px] font-semibold text-white transition hover:bg-[#0F3E79]">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"/>
        </svg>
        Nouvelle demande
      </button>
    </div>

    <!-- KPI row -->
    <div class="mb-8 grid gap-5 sm:grid-cols-2 xl:grid-cols-4">

      <div *ngFor="let kpi of kpis"
        class="flex items-center gap-4 rounded-xl bg-white px-5 py-5 ring-1 ring-slate-100">

        <!-- Icône -->
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
          [ngClass]="[kpi.iconBg, kpi.iconColor]">
          <ng-container [ngSwitch]="kpi.id">

            <svg *ngSwitchCase="'devis'" width="16" height="20" viewBox="0 0 16 20" fill="none">
              <path d="M4 16H12V14H4V16ZM4 12H12V10H4V12ZM2 20C1.45 20 0.979167 19.8042 0.5875 19.4125C0.195833 19.0208 0 18.55 0 18V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H10L16 6V18C16 18.55 15.8042 19.0208 15.4125 19.4125C15.0208 19.8042 14.55 20 14 20H2ZM9 7V2H2V18H14V7H9ZM2 2V7V2V7V18V2Z" fill="currentColor"/>
            </svg>

            <svg *ngSwitchCase="'prix'" width="22" height="16" viewBox="0 0 22 16" fill="none">
              <path d="M13 9C12.1667 9 11.4583 8.70833 10.875 8.125C10.2917 7.54167 10 6.83333 10 6C10 5.16667 10.2917 4.45833 10.875 3.875C11.4583 3.29167 12.1667 3 13 3C13.8333 3 14.5417 3.29167 15.125 3.875C15.7083 4.45833 16 5.16667 16 6C16 6.83333 15.7083 7.54167 15.125 8.125C14.5417 8.70833 13.8333 9 13 9ZM6 12C5.45 12 4.97917 11.8042 4.5875 11.4125C4.19583 11.0208 4 10.55 4 10V2C4 1.45 4.19583 0.979167 4.5875 0.5875C4.97917 0.195833 5.45 0 6 0H20C20.55 0 21.0208 0.195833 21.4125 0.5875C21.8042 0.979167 22 1.45 22 2V10C22 10.55 21.8042 11.0208 21.4125 11.4125C21.0208 11.8042 20.55 12 20 12H6ZM8 10H18C18 9.45 18.1958 8.97917 18.5875 8.5875C18.9792 8.19583 19.45 8 20 8V4C19.45 4 18.9792 3.80417 18.5875 3.4125C18.1958 3.02083 18 2.55 18 2H8C8 2.55 7.80417 3.02083 7.4125 3.4125C7.02083 3.80417 6.55 4 6 4V8C6.55 8 7.02083 8.19583 7.4125 8.5875C7.80417 8.97917 8 9.45 8 10ZM19 16H2C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V3H2V14H19V16ZM6 10V2V10Z" fill="currentColor"/>
            </svg>

            <svg *ngSwitchCase="'delai'" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M13.3 14.7L14.7 13.3L11 9.6V5H9V10.4L13.3 14.7ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20ZM10 18C12.2167 18 14.1042 17.2208 15.6625 15.6625C17.2208 14.1042 18 12.2167 18 10C18 7.78333 17.2208 5.89583 15.6625 4.3375C14.1042 2.77917 12.2167 2 10 2C7.78333 2 5.89583 2.77917 4.3375 4.3375C2.77917 5.89583 2 7.78333 2 10C2 12.2167 2.77917 14.1042 4.3375 15.6625C5.89583 17.2208 7.78333 18 10 18Z" fill="currentColor"/>
            </svg>

            <svg *ngSwitchCase="'echeance'" width="18" height="20" viewBox="0 0 18 20" fill="none">
              <path d="M11.5 16C10.8 16 10.2083 15.7583 9.725 15.275C9.24167 14.7917 9 14.2 9 13.5C9 12.8 9.24167 12.2083 9.725 11.725C10.2083 11.2417 10.8 11 11.5 11C12.2 11 12.7917 11.2417 13.275 11.725C13.7583 12.2083 14 12.8 14 13.5C14 14.2 13.7583 14.7917 13.275 15.275C12.7917 15.7583 12.2 16 11.5 16ZM2 20C1.45 20 0.979167 19.8042 0.5875 19.4125C0.195833 19.0208 0 18.55 0 18V4C0 3.45 0.195833 2.97917 0.5875 2.5875C0.979167 2.19583 1.45 2 2 2H3V0H5V2H13V0H15V2H16C16.55 2 17.0208 2.19583 17.4125 2.5875C17.8042 2.97917 18 3.45 18 4V18C18 18.55 17.8042 19.0208 17.4125 19.4125C17.0208 19.8042 16.55 20 16 20H2ZM2 18H16V8H2V18ZM2 6H16V4H2V6ZM2 6V4V6Z" fill="currentColor"/>
            </svg>

          </ng-container>
        </span>

        <!-- Valeur -->
        <div>
          <p class="text-[10px] uppercase tracking-widest text-[#434655]">{{ kpi.label }}</p>
          <p class="mt-0.5 text-2xl font-semibold text-[#191B23]">{{ kpi.value }}</p>
        </div>

      </div>

    </div>

    <!-- Filtres + tri -->
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex flex-wrap gap-3">
        <button
          class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-[#475569] transition hover:bg-slate-50">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 6h18M7 12h10M11 18h2"/>
          </svg>
          Filtrer par Prix
        </button>
        <button
          class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-[#475569] transition hover:bg-slate-50">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="9" stroke-width="1.8"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m9 12 2 2 4-4"/>
          </svg>
          Fournisseurs Agréés
        </button>
      </div>
      <p class="text-sm text-[#94A3B8]">
        Trier par : <span class="font-semibold text-[#2563EB]">Pertinence</span>
      </p>
    </div>

    <!-- Cartes fournisseurs -->
    <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
      <article *ngFor="let f of detail?.fournisseurs"
        class="flex flex-col rounded-2xl bg-white p-6 ring-1 ring-slate-100 transition hover:shadow-sm">

        <!-- Nom + note -->
        <div>
          <h2 class="text-[17px] font-bold text-[#0F172A]">{{ f.nom }}</h2>
          <div class="mt-1 flex items-center gap-1.5 text-sm">
            <svg class="h-4 w-4 text-[#F59E0B]" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span class="font-semibold text-[#0F172A]">{{ f.note }}</span>
            <span class="text-[#94A3B8]">({{ f.avis }} avis)</span>
          </div>
        </div>

        <!-- Prix + délai -->
        <div class="mt-4 grid grid-cols-2 gap-3">
          <div class="rounded-xl bg-[#F8FAFC] px-4 py-3">
            <p class="text-[9px] font-bold uppercase tracking-widest text-[#94A3B8]">Prix total</p>
            <p class="mt-1 text-sm font-bold text-[#2563EB]">{{ f.prixTotal }}</p>
          </div>
          <div class="rounded-xl bg-[#F8FAFC] px-4 py-3">
            <p class="text-[9px] font-bold uppercase tracking-widest text-[#94A3B8]">Délai livraison</p>
            <p class="mt-1 text-xl font-bold text-[#0F172A]">{{ f.delaiLivraison }}</p>
          </div>
        </div>

        <!-- Date + statut -->
        <div class="mt-4 space-y-2.5 text-sm">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-[#64748B]">
              <svg class="h-3.5 w-3.5 shrink-0 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="3" y="4" width="18" height="18" rx="2" stroke-width="1.8"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 2v4M8 2v4M3 10h18"/>
              </svg>
              Reçu le
            </div>
            <span class="font-semibold text-[#0F172A]">{{ f.dateReception }}</span>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-[#64748B]">
              <!-- icône check -->
              <ng-container *ngIf="statutIconType(f.statut) === 'check'">
                <svg class="h-3.5 w-3.5 shrink-0 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="9" stroke-width="1.8"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m8.5 12.5 2.3 2.3 4.7-5"/>
                </svg>
              </ng-container>
              <!-- icône clock -->
              <ng-container *ngIf="statutIconType(f.statut) === 'clock'">
                <svg class="h-3.5 w-3.5 shrink-0 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="9" stroke-width="1.8"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 7v5l3 3"/>
                </svg>
              </ng-container>
              <!-- icône warning -->
              <ng-container *ngIf="statutIconType(f.statut) === 'warning'">
                <svg class="h-3.5 w-3.5 shrink-0 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="9" stroke-width="1.8"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4M12 16h.01"/>
                </svg>
              </ng-container>
              Statut
            </div>
            <span class="font-semibold" [ngClass]="statutClass(f.statut)">{{ f.statut }}</span>
          </div>
        </div>

        <!-- Bouton voir détail -->
        <button
          (click)="openDevis(f.slug)"
          class="mt-5 flex w-full items-center justify-center gap-2 rounded-xl border border-[#2563EB] py-3 text-sm font-semibold text-[#2563EB] transition hover:bg-[#EFF6FF]">
          Voir détail
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>

      </article>
    </div>

  </div>
</div>
