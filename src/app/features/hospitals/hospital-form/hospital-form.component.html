<div class="min-h-screen bg-[#F4F6F9] p-6">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- ── HEADER ─────────────────────────────────────────────────────────── -->
    <div class="flex items-center gap-3">
      <button (click)="annuler()"
        class="w-9 h-9 rounded-xl border border-gray-200 bg-white flex items-center justify-center text-gray-500 hover:bg-gray-50 transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <div>
        <h1 class="text-xl font-bold text-[#1E293B]">Ajouter un hôpital</h1>
        <p class="text-sm text-[#64748B]">Enregistrez un nouvel établissement hospitalier.</p>
      </div>
    </div>

    <!-- ── FORMULAIRE ─────────────────────────────────────────────────────── -->
    <div class="bg-white rounded-2xl shadow-sm p-6 space-y-5">

      <!-- Nom -->
      <div>
        <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Nom de l'établissement <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="form.name" placeholder="Ex : Hôpital Principal de Dakar"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382]">
      </div>

      <!-- Type -->
      <div>
        <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Type d'établissement</label>
        <select [(ngModel)]="form.type"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382] bg-white">
          <option value="">— Sélectionner un type —</option>
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>

      <!-- Email / Téléphone -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Email</label>
          <input type="email" [(ngModel)]="form.email" placeholder="contact@hopital.sn"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382]">
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Téléphone</label>
          <input type="tel" [(ngModel)]="form.phone" placeholder="+221 33 xxx xx xx"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382]">
        </div>
      </div>

      <!-- Région / Département -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Région</label>
          <select [(ngModel)]="form.region" (change)="onRegionChange()"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382] bg-white">
            <option value="">— Région —</option>
            <option *ngFor="let r of regions" [value]="r.name">{{ r.name }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Département</label>
          <select [(ngModel)]="form.department" (change)="onDeptChange()" [disabled]="!form.region"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382] bg-white disabled:opacity-60">
            <option value="">— Département —</option>
            <option *ngFor="let d of departments" [value]="d.name">{{ d.name }}</option>
          </select>
        </div>
      </div>

      <!-- Commune -->
      <div>
        <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Commune</label>
        <select [(ngModel)]="form.commune" [disabled]="!form.department"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382] bg-white disabled:opacity-60">
          <option value="">— Commune —</option>
          <option *ngFor="let c of communes" [value]="c">{{ c }}</option>
        </select>
      </div>

      <!-- Adresse libre -->
      <div>
        <label class="block text-sm font-semibold text-[#1E293B] mb-1.5">Adresse complète</label>
        <input type="text" [(ngModel)]="form.address" placeholder="Ex : Avenue Cheikh Anta Diop, Dakar"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-[#1E293B] focus:outline-none focus:ring-2 focus:ring-[#104382]">
        <p class="text-xs text-gray-400 mt-1">Laissez vide pour utiliser Région / Commune.</p>
      </div>

      <!-- Statut -->
      <div class="flex items-center justify-between p-4 bg-[#F8FAFC] rounded-xl border border-gray-100">
        <div>
          <p class="text-sm font-semibold text-[#1E293B]">Établissement actif</p>
          <p class="text-xs text-[#64748B]">Visible et opérationnel sur la plateforme.</p>
        </div>
        <button type="button" (click)="form.isActive = !form.isActive"
          class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none"
          [class.bg-[#104382]]="form.isActive" [class.bg-gray-300]="!form.isActive">
          <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
            [class.translate-x-6]="form.isActive" [class.translate-x-1]="!form.isActive"></span>
        </button>
      </div>

      <!-- Erreur -->
      <div *ngIf="saveError" class="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-600">
        {{ saveError }}
      </div>
    </div>

    <!-- ── ACTIONS ─────────────────────────────────────────────────────────── -->
    <div class="flex items-center justify-end gap-3">
      <button (click)="annuler()"
        class="px-5 py-2.5 border border-gray-200 bg-white rounded-xl text-sm font-semibold text-[#475569] hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button (click)="enregistrer()" [disabled]="saving || !form.name.trim()"
        class="flex items-center gap-2 px-6 py-2.5 bg-[#104382] hover:bg-[#0D3568] text-white rounded-xl text-sm font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        <svg *ngIf="saving" class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        {{ saving ? 'Enregistrement…' : 'Enregistrer l\'hôpital' }}
      </button>
    </div>

  </div>
</div>
