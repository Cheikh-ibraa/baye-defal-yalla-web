<div class="flex h-screen bg-[#F4F6F9]">
    <!-- Sidebar -->
    <app-sidebar [isOpen]="isMobileMenuOpen" (closeSidebar)="isMobileMenuOpen = false"></app-sidebar>
    
    <!-- Main Content -->
    <div class="flex flex-col flex-1 overflow-hidden lg:pl-[220px] xl:pl-[270px]">
      <!-- Header -->
      <app-header (toggleSidebar)="isMobileMenuOpen = !isMobileMenuOpen"></app-header>
      
      <!-- Page Content -->
      <main class="flex-1 overflow-x-hidden overflow-y-auto bg-fourth">
        <div class="container mx-auto p-4 md:p-6 max-w-full">
          <!-- IMPORTANT: Réactivez le router-outlet -->
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
