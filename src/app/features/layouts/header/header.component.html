<!-- Breadcrumb Navigation -->
<nav class="flex items-center justify-between px-6 py-4 bg-[#FFFFFF] border-gray-200">
  <!-- Left side - Breadcrumb -->
  <div class="flex items-center space-x-2 text-gray-600">
    <!-- Vous pouvez ajouter votre breadcrumb ici -->
  </div>

  <!-- Right side - User actions -->
  <div class="flex items-center space-x-4">
    <!-- Notification bell -->
    <button class="relative p-2 rounded-full hover:bg-gray-100 transition-colors" (click)="onNotificationClick()">
      <img src="assets/images/notif.png" alt="Notifications">
      <!-- Notification badge (dynamique) -->
      <span *ngIf="getNotificationCount() > 0"
        class="absolute -top-1 -right-1 h-5 w-5 bg-red-500 rounded-full flex items-center justify-center text-white text-xs font-bold">
        {{ getNotificationCount() }}
      </span>
    </button>

    <!-- Theme toggle -->
    <div class="relative theme-dropdown">
      <!-- Bouton pour ouvrir le dropdown -->
      <button (click)="toggleDropdown()"
        class="p-2 rounded-lg hover:bg-gray-100 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Changer le thème">
        <!-- Icône soleil (thème actuel) -->
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
          </path>
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div *ngIf="isDropdownOpen"
        class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
        <!-- En-tête du dropdown -->
        <div class="px-4 py-2 text-sm font-medium text-gray-500 border-b border-gray-100">
          Période
        </div>

        <!-- Option Clair -->
        <button (click)="selectTheme('Clair')"
          class="w-full flex items-center px-4 py-3 text-left hover:bg-gray-50 transition-colors duration-150"
          [class.bg-blue-50]="selectedTheme === 'Clair'">
          <svg class="w-5 h-5 text-blue-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
            </path>
          </svg>
          <span class="text-gray-800">Clair</span>
        </button>

        <!-- Option Sombre -->
        <button (click)="selectTheme('Sombre')"
          class="w-full flex items-center px-4 py-3 text-left hover:bg-gray-50 transition-colors duration-150"
          [class.bg-blue-50]="selectedTheme === 'Sombre'">
          <svg class="w-5 h-5 text-gray-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
            </path>
          </svg>
          <span class="text-gray-800">Sombre</span>
        </button>

        <!-- Option Système -->
        <button (click)="selectTheme('Système')"
          class="w-full flex items-center px-4 py-3 text-left hover:bg-gray-50 transition-colors duration-150"
          [class.bg-blue-50]="selectedTheme === 'Système'">
          <svg class="w-5 h-5 text-gray-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
            </path>
          </svg>
          <span class="text-gray-800">Système</span>
        </button>
      </div>
    </div>

    <!-- User profile -->
    <div class="flex items-center space-x-3 user-menu-container">
      <div class="relative">
        <!-- Avatar de l'utilisateur -->
        <img [src]="userAvatar" [alt]="userDisplayName"
          class="w-10 h-10 rounded-full object-cover border-2 border-gray-200 cursor-pointer hover:border-gray-300 transition-colors"
          (click)="toggleUserMenu()" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <!-- Fallback avec initiales si l'image n'existe pas -->
        <div
          class="w-10 h-10 rounded-full bg-blue-500 text-white font-semibold flex items-center justify-center cursor-pointer hover:bg-blue-600 transition-colors hidden"
          (click)="toggleUserMenu()">
          {{ getUserInitials() }}
        </div>

        <!-- User menu dropdown -->
        <div *ngIf="isUserMenuOpen"
          class="absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-2xl z-50 border border-gray-100 overflow-hidden"
          style="box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.08);">
          <!-- User info card -->
          <div class="px-5 py-4 bg-gradient-to-br from-[#f8faff] to-[#eef4ff] border-b border-gray-100">
            <div class="flex items-center gap-3">
              <!-- Avatar -->
              <div class="relative flex-shrink-0">
                <img [src]="userAvatar" [alt]="userDisplayName"
                  class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-sm"
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div
                  class="w-11 h-11 rounded-full bg-gradient-to-br from-[#2C7BE5] to-[#6f42c1] text-white text-sm font-bold flex items-center justify-center shadow-sm hidden">
                  {{ getUserInitials() }}
                </div>
                <!-- Online dot -->
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></span>
              </div>
              <!-- Info -->
              <div class="min-w-0">
                <p class="text-sm font-semibold text-gray-900 truncate">{{ formatName(userDisplayName) || 'Utilisateur'
                  }}</p>
                <span
                  class="inline-flex items-center px-2 py-0.5 mt-0.5 rounded-full text-[10px] font-medium bg-blue-100 text-blue-700">
                  {{ formatRole(userRole) || 'Utilisateur' }}
                </span>
              </div>
            </div>
          </div>

          <!-- Menu items -->
          <div class="py-2">
            <!-- Mon Compte -->
            <button (click)="onProfileClick()"
              class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors group">
              <div
                class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center flex-shrink-0 group-hover:bg-blue-100 transition-colors">
                <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <span class="font-medium">Mon Compte</span>
              <svg class="w-4 h-4 text-gray-400 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </button>

          </div>

          <!-- Divider -->
          <div class="border-t border-gray-100 mx-3"></div>

          <!-- Déconnexion -->
          <div class="py-2">
            <button (click)="onLogout()"
              class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors group">
              <div
                class="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center flex-shrink-0 group-hover:bg-red-100 transition-colors">
                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
              </div>
              <span class="font-medium">Déconnexion</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Informations utilisateur (dynamiques) -->
      <div class="flex flex-col text-right mr-2 leading-tight">
        <!-- NOM -->
        <span class="text-sm font-semibold text-gray-900">
          {{ formatName(userDisplayName) || 'Utilisateur' }}
        </span>

        <!-- ROLE -->
        <span class="text-sm ">
          {{ formatRole(userRole) || 'Utilisateur' }}
        </span>
      </div>

    </div>
  </div>
</nav>

  <div class="flex items-center space-x-2">
    <!-- Notification mobile -->
    <button class="relative p-1 rounded-full" (click)="onNotificationClick()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-5-5V6a4 4 0 00-8 0v6l-5 5h5m0 0v1a3 3 0 006 0v-1m-6 0h6" />
      </svg>
      <span *ngIf="getNotificationCount() > 0" class="absolute -top-1 -right-1 h-3 w-3 bg-red-500 rounded-full"></span>
    </button>

    <!-- Avatar mobile -->
    <img [src]="userAvatar" [alt]="userDisplayName"
      class="w-8 h-8 rounded-full object-cover border border-gray-200 cursor-pointer" (click)="toggleUserMenu()"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">

    <!-- Fallback avec initiales (mobile) -->
    <div
      class="w-8 h-8 rounded-full bg-blue-500 text-white text-xs font-semibold flex items-center justify-center cursor-pointer hidden"
      (click)="toggleUserMenu()">
      {{ getUserInitials() }}
    </div>
  </div>
</nav>
