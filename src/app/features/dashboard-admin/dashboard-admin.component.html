<!-- Container principal avec fond gris -->
<div class="min-h-screen bg-[#f5f7fa]">
    <!-- Header du dashboard -->
    <div class="mb-8">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <!-- Titre et description -->
            <div>
                <h1 class="text-xl sm:text-3xl font-semibold text-[#343A40] mb-2">Tableau de bord</h1>
                <p class="text-[#343A40] text-sm md:text-base">Vue d'ensemble de la plateforme</p>
            </div>

            <!-- Actions du header -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <!-- Sélecteur de période -->
                <div class="relative">
                    <button
                        class="w-full sm:w-auto flex items-center gap-2 px-5 py-2.5 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors text-gray-700 font-medium">
                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span>{{ selectedPeriod }}</span>
                        <svg class="w-4 h-4 ml-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                </div>

                <!-- Bouton Exporter -->
                <button (click)="exportData()"
          class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-2.5 bg-[#104382] text-white rounded-lg transition-colors font-medium shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Exporter
                </button>
            </div>
        </div>
    </div>

    <!-- Cartes statistiques -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 mb-8">
        <div *ngFor="let card of statsCards"
            class="bg-white rounded-xl shadow-sm p-6 hover:shadow-md transition-shadow">
            <!-- Header de la carte -->
            <div class="flex items-start justify-between mb-4">
                <p class="text-[#6B7280] text-sm font-medium">{{ card.title }}</p>

                <!-- Icônes -->
                <div class="p-2.5 rounded-lg flex items-center justify-center" [ngClass]="card.iconColor">
                    <!-- Icône Users -->
                    <svg *ngIf="card.icon === 'users'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                    </svg>

                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M15 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V7L15 2Z"

                            stroke-linejoin="round" />
                        <path d="M16 13H8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M16 17H8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>

                    <!-- Medecin Actifs -->

                        xmlns="http://www.w3.org/2000/svg">

                            fill="#00B894" />
                    </svg>

                    <!-- Icône Check -->
                    <svg *ngIf="card.icon === 'check'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M21.8026 10.0005C22.2593 12.2418 21.9338 14.5719 20.8804 16.6023C19.827 18.6326 18.1095 20.2405 16.0141 21.1578C13.9187 22.0751 11.5722 22.2463 9.36586 21.6428C7.15954 21.0394 5.22676 19.6979 3.88984 17.8419C2.55293 15.9859 1.89269 13.7277 2.01923 11.4439C2.14577 9.16001 3.05144 6.98857 4.58522 5.29165C6.11899 3.59473 8.18815 2.47491 10.4476 2.11893C12.7071 1.76295 15.0203 2.19234 17.0016 3.33548"
                            stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M9 11L12 14L22 4" stroke="#16A34A" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>


                    <!-- Icône Heart -->
                    <svg *ngIf="card.icon === 'heart'" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 5.49999L11.46 6.01999C11.53 6.09257 11.6138 6.15031 11.7066 6.18974C11.7994 6.22918 11.8992 6.24951 12 6.24951C12.1008 6.24951 12.2006 6.22918 12.2934 6.18974C12.3862 6.15031 12.47 6.09257 12.54 6.01999L12 5.49999ZM9.426 18.322C7.91 17.127 6.253 15.96 4.938 14.48C3.65 13.028 2.75 11.335 2.75 9.13699H1.25C1.25 11.803 2.36 13.837 3.817 15.476C5.247 17.086 7.071 18.376 8.497 19.5L9.426 18.322ZM2.75 9.13699C2.75 6.98699 3.965 5.18299 5.624 4.42399C7.236 3.68699 9.402 3.88199 11.46 6.01999L12.54 4.98099C10.1 2.44399 7.264 2.02499 5 3.05999C2.786 4.07299 1.25 6.42499 1.25 9.13699H2.75ZM8.497 19.5C9.01 19.904 9.56 20.334 10.117 20.66C10.674 20.986 11.31 21.25 12 21.25V19.75C11.69 19.75 11.326 19.63 10.874 19.365C10.421 19.101 9.952 18.737 9.426 18.322L8.497 19.5ZM15.503 19.5C16.929 18.375 18.753 17.087 20.183 15.476C21.64 13.836 22.75 11.803 22.75 9.13699H21.25C21.25 11.335 20.35 13.028 19.062 14.48C17.747 15.96 16.09 17.127 14.574 18.322L15.503 19.5ZM22.75 9.13699C22.75 6.42499 21.215 4.07299 19 3.05999C16.736 2.02499 13.902 2.44399 11.46 4.97999L12.54 6.01999C14.598 3.88299 16.764 3.68699 18.376 4.42399C20.035 5.18299 21.25 6.98599 21.25 9.13699H22.75ZM14.574 18.322C14.048 18.737 13.579 19.101 13.126 19.365C12.673 19.629 12.31 19.75 12 19.75V21.25C12.69 21.25 13.326 20.985 13.883 20.66C14.441 20.334 14.99 19.904 15.503 19.5L14.574 18.322Z"
                            fill="#F44336" />
                    </svg>

                    <!-- Icône Building -->
                    <svg *ngIf="card.icon === 'pharmacie'" width="18" height="18" viewBox="0 0 18 18" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M8.93502 5.25195H10.25C10.3826 5.25195 10.5098 5.19927 10.6036 5.10551C10.6973 5.01174 10.75 4.88456 10.75 4.75195C10.75 4.61934 10.6973 4.49217 10.6036 4.3984C10.5098 4.30463 10.3826 4.25195 10.25 4.25195H8.93502C8.76052 4.25195 8.55752 4.28045 8.36002 4.37695C7.64802 4.72445 7.24502 5.32545 7.02352 5.91095C6.94852 6.10845 6.89302 6.30845 6.85202 6.50195H7.88102C7.90335 6.42195 7.92919 6.34279 7.95852 6.26445C8.11952 5.83845 8.38102 5.47945 8.79852 5.27545C8.84172 5.257 8.88814 5.24895 8.93502 5.25195ZM6.00052 7.00195C5.72452 7.00195 5.49402 7.22995 5.56902 7.49595C5.85752 8.52545 7.03202 9.32645 8.50052 9.47645V10.2555C8.15302 10.264 7.79202 10.292 7.48552 10.381C7.24652 10.451 6.99302 10.57 6.79902 10.788C6.59602 11.016 6.50052 11.304 6.50052 11.6255C6.50052 11.947 6.59552 12.2355 6.79852 12.464C6.99252 12.6825 7.24602 12.8025 7.48552 12.8725C7.64552 12.919 7.82052 12.949 8.00052 12.968V11.9615C7.92113 11.9507 7.8426 11.9343 7.76552 11.9125C7.63052 11.8725 7.57102 11.8285 7.54652 11.8005C7.53052 11.7825 7.50052 11.742 7.50052 11.6255C7.50052 11.5105 7.53052 11.4705 7.54552 11.453C7.57052 11.425 7.62952 11.3805 7.76552 11.341C7.95702 11.2855 8.20402 11.2645 8.50052 11.2565V14.002H7.00052V15.002H11.0005V14.002H9.50052V11.2335C10.0515 11.1905 10.498 11.0695 10.834 10.853C11.3065 10.548 11.5005 10.0945 11.5005 9.61295C11.5045 9.3558 11.4407 9.10213 11.3155 8.87745C11.8775 8.52245 12.279 8.04145 12.432 7.49595C12.507 7.22995 12.277 7.00195 12.0005 7.00195H6.00052ZM10.292 10.012C10.1505 10.1035 9.90502 10.1905 9.50052 10.2295V9.47645C9.80091 9.44697 10.0976 9.38733 10.386 9.29845C10.4685 9.37695 10.5005 9.47245 10.5005 9.61345C10.5005 9.79845 10.4445 9.91395 10.292 10.012Z"
                            fill="#2C7BE5" />
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M13 13H18V5H13V0H5V5H0V13H5V18H13V13ZM12 17V12H17V6H12V1H6V6H1V12H6V17H12Z"
                            fill="#2C7BE5" />
                    </svg>

                </div>
            </div>

            <!-- Valeur principale avec loading -->
            <div class="mb-2">
                <div *ngIf="card.loading" class="h-12 bg-gray-200 rounded animate-pulse"></div>
                <h2 *ngIf="!card.loading" class="text-2xl md:text-3xl font-semibold">{{ card.value }}</h2>
            </div>

            <!-- Footer de la carte -->
            <div class="flex items-center justify-between">
                <p class="text-gray-500 text-sm">{{ card.subtitle }}</p>

                <!-- Trend si disponible -->
                <div *ngIf="card.trend && !card.loading" class="flex items-center gap-1">
                    <svg *ngIf="card.trend === 'up'" class="w-4 h-4 text-green-500" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 10l7-7m0 0l7 7m-7-7v18" />
                    </svg>
                    <svg *ngIf="card.trend === 'down'" class="w-4 h-4 text-red-500" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                    </svg>
                    <span [ngClass]="card.trend === 'up' ? 'text-green-600' : 'text-red-600'"
                        class="text-sm font-medium">{{
                        card.trendValue }}</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Section avec deux colonnes -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Activité en temps réel -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-6">Activité en temps réel</h2>

            <div class="space-y-4">
                <div *ngFor="let activity of activities"
                    class="flex items-start gap-4 p-3 rounded-lg hover:bg-gray-50 transition-colors">
                    <!-- Icône d'activité -->
                    <div class="flex-shrink-0 mt-0.5">
                        <div *ngIf="activity.type === 'warning'"
                            class="w-10 h-10 rounded-md bg-red-50 flex items-center justify-center">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L1 21H23M12 6L19.53 19H4.47M11 10V14H13V10M11 16V18H13V16"
                                    fill="#F54351" />
                            </svg>

                        </div>
                        <div *ngIf="activity.type === 'success'"
                            class="w-10 h-10 rounded-md bg-green-50 flex items-center justify-center">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M21.8026 10.0005C22.2593 12.2418 21.9338 14.5719 20.8804 16.6023C19.827 18.6326 18.1095 20.2405 16.0141 21.1578C13.9187 22.0751 11.5722 22.2463 9.36586 21.6428C7.15954 21.0394 5.22676 19.6979 3.88984 17.8419C2.55293 15.9859 1.89269 13.7277 2.01923 11.4439C2.14577 9.16001 3.05144 6.98857 4.58522 5.29165C6.11899 3.59473 8.18815 2.47491 10.4476 2.11893C12.7071 1.76295 15.0203 2.19234 17.0016 3.33548"
                                    stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M9 11L12 14L22 4" stroke="#16A34A" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>

                        </div>
                        <div *ngIf="activity.type === 'info'"
                            class="w-10 h-10 rounded-md bg-blue-50 flex items-center justify-center">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
