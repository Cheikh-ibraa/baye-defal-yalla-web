<div class="min-h-screen py-4 sm:px-4">
  <div class="max-w-6xl mx-auto">
    <!-- Header with back button -->
    <div class="mb-6 flex flex-row items-center gap-4">
      <button (click)="goBack()"
        class="inline-flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:bg-gray-50 transition-colors mb-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 12H4M4 12L10 6M4 12L10 18" stroke="#2B3674" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Nouveau Certificat Médical</h1>
        <p class="text-sm text-gray-600 mt-1">
          Sélectionnez un patient, renseignez la prescription puis générez un QR et un PDF.
        </p>
      </div>
    </div>
    <!-- Form Container -->
    <div class="bg-white rounded-lg shadow-sm p-6">
      <form (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Informations Patient -->
        <div>
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Informations Patient</h2>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                N° Référence
              </label>
              <input type="text" [(ngModel)]="formData.nReference" name="nReference" readonly
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-50 text-gray-600 text-sm cursor-not-allowed" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Nom du patient
              </label>
              <input type="text" [(ngModel)]="formData.nomPatient" name="nomPatient" readonly
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-50 text-gray-600 text-sm cursor-not-allowed" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Téléphone
              </label>
              <input type="text" [(ngModel)]="formData.telephone" name="telephone" readonly
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-50 text-gray-600 text-sm cursor-not-allowed" />
            </div>
          </div>
        </div>

        <!-- Type et Dates -->

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-medium text-gray-700">
                Type de certificat <span class="text-red-500">*</span>
              </label>
              <button type="button" (click)="openAddTypeModal()"
                class="inline-flex items-center gap-1 px-2 py-1 text-xs text-teal-600 hover:text-teal-700 hover:bg-teal-50 rounded transition-colors"
                title="Ajouter un type">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                <span>Ajouter</span>
              </button>
            </div>
            <select [(ngModel)]="formData.typeId" name="typeId" required
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all bg-white text-sm appearance-none"
              style="background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27currentColor%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3e%3cpolyline points=%276 9 12 15 18 9%27%3e%3c/polyline%3e%3c/svg%3e'); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 1.25rem; padding-right: 2.5rem;">
              <option value="0">Sélectionner un type</option>
              <option *ngFor="let type of typesCertificat" [value]="type.id">{{ type.label }}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Date de début <span class="text-red-500">*</span>
            </label>
            <input type="date" [(ngModel)]="formData.startDate" name="startDate" [min]="minDate" required
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all text-sm" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Date de fin <span class="text-red-500">*</span>
            </label>
            <input type="date" [(ngModel)]="formData.endDate" name="endDate" [min]="formData.startDate || minDate"
              required
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all text-sm" />
          </div>
        </div>


        <!-- Motif -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Motif <span class="text-red-500">*</span>
          </label>
          <textarea [(ngModel)]="formData.motif" name="motif" rows="4" required
            placeholder="Indiquez le motif du certificat médical..."
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all resize-none text-sm"></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button type="submit" [disabled]="isSubmitting"
            class="px-6 py-2.5 bg-teal-600 text-white font-medium rounded-lg hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 transition-colors text-sm disabled:opacity-50 disabled:cursor-not-allowed">
            {{ isSubmitting ? 'Création en cours...' : 'Créer le certificat' }}
          </button>

          <button type="button" (click)="onCancel()"
            class="px-6 py-2.5 bg-white text-gray-700 font-medium rounded-lg hover:bg-gray-50 focus:outline-none transition-colors text-sm border border-gray-300">
            Annuler
          </button>
        </div>
      </form>
    </div>

    <!-- Modal Ajout Type -->
    <div *ngIf="showAddTypeModal"
      class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Ajouter un type de certificat</h3>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Code <span class="text-red-500">*</span>
            </label>
            <input type="text" [(ngModel)]="newType.code" placeholder="Ex: CERT_ARRET"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all text-sm" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Libellé <span class="text-red-500">*</span>
            </label>
            <input type="text" [(ngModel)]="newType.label" placeholder="Ex: Certificat d'arrêt de travail"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all text-sm" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Description
            </label>
            <textarea [(ngModel)]="newType.description" rows="3" placeholder="Description optionnelle..."
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all resize-none text-sm"></textarea>
          </div>
        </div>

        <div class="flex gap-3 mt-6">
          <button (click)="addCertificateType()"
            class="flex-1 px-4 py-2.5 bg-teal-600 text-white font-medium rounded-lg hover:bg-teal-700 transition-colors text-sm">
            Ajouter
          </button>
          <button (click)="closeAddTypeModal()"
            class="flex-1 px-4 py-2.5 bg-white text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors text-sm border border-gray-300">
            Annuler
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
