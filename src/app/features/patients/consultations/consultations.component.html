<div class="hospitalisation-container">
    <!-- Header -->
    <div class="header">
       <button (click)="goBack()"
        class="inline-flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:bg-gray-50 transition-colors mb-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 12H4M4 12L10 6M4 12L10 18" stroke="#2B3674" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
        <div class="header-content">
            <h1 class="header-title">Nouvelle consultation</h1>
            <p class="header-subtitle">Enregistrez une note de consultation pour un patient</p>
        </div>
    </div>

    <!-- Form Container -->
    <div class="form-container">
        <form (ngSubmit)="onSubmit()">

            <!-- Informations Patient -->
            <div class="form-section">
                <div class="section-header">
                    <h2 class="section-title">Informations Patient</h2>
                </div>

                <div class="section-content">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">
                                N° Référence <span class="required">*</span>
                            </label>
                            <input type="text" class="form-input" [(ngModel)]="formData.nReferent" name="nReferent"
                                placeholder="Ex: NDIAYE-00000025" readonly />
                        </div>

                        <div class="form-group">
                            <label class="form-label">Nom du patient</label>
                            <input type="text" class="form-input" [(ngModel)]="formData.nomPatient" name="nomPatient"
                                placeholder="Awa Ndiaye" readonly />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Informations de consultation -->
            <div class="form-section">

                <div class="section-content">
                    <div class="form-group">
                        <label class="form-label">
                            Date de consultation <span class="required">*</span>
                        </label>
                        <input type="datetime-local" class="form-input" [(ngModel)]="formData.date" name="date"
                            required />
                        <p class="text-xs text-gray-500 mt-1">Format: JJ-MM-AAAA HH:mm</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Titre de la consultation <span class="required">*</span>
                        </label>
                        <input type="text" class="form-input" [(ngModel)]="formData.titre" name="titre"
                            placeholder="Ex: Consultation de suivi - Diabète" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Type de consultation <span class="required">*</span>
                        </label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="typeConsultation" value="PRESENTIEL"
                                    [(ngModel)]="formData.typeConsultation" />
                                <span class="radio-text">
                                    <svg width="15" height="20" viewBox="0 0 15 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M12.7075 11.175C12.0525 12.5025 11.165 13.825 10.2575 15.0125C9.39569 16.1313 8.47523 17.2036 7.5 18.225C6.52477 17.2036 5.60431 16.1313 4.7425 15.0125C3.835 13.825 2.9475 12.5025 2.2925 11.175C1.63 9.83375 1.25 8.5775 1.25 7.5C1.25 5.8424 1.90848 4.25269 3.08058 3.08058C4.25269 1.90848 5.8424 1.25 7.5 1.25C9.1576 1.25 10.7473 1.90848 11.9194 3.08058C13.0915 4.25269 13.75 5.8424 13.75 7.5C13.75 8.5775 13.3688 9.83375 12.7075 11.175ZM7.5 20C7.5 20 15 12.8925 15 7.5C15 5.51088 14.2098 3.60322 12.8033 2.1967C11.3968 0.790176 9.48912 0 7.5 0C5.51088 0 3.60322 0.790176 2.1967 2.1967C0.790176 3.60322 2.96403e-08 5.51088 0 7.5C0 12.8925 7.5 20 7.5 20Z" fill="black"/>
<path d="M7.5 10C6.83696 10 6.20107 9.73661 5.73223 9.26777C5.26339 8.79893 5 8.16304 5 7.5C5 6.83696 5.26339 6.20107 5.73223 5.73223C6.20107 5.26339 6.83696 5 7.5 5C8.16304 5 8.79893 5.26339 9.26777 5.73223C9.73661 6.20107 10 6.83696 10 7.5C10 8.16304 9.73661 8.79893 9.26777 9.26777C8.79893 9.73661 8.16304 10 7.5 10ZM7.5 11.25C8.49456 11.25 9.44839 10.8549 10.1517 10.1517C10.8549 9.44839 11.25 8.49456 11.25 7.5C11.25 6.50544 10.8549 5.55161 10.1517 4.84835C9.44839 4.14509 8.49456 3.75 7.5 3.75C6.50544 3.75 5.55161 4.14509 4.84835 4.84835C4.14509 5.55161 3.75 6.50544 3.75 7.5C3.75 8.49456 4.14509 9.44839 4.84835 10.1517C5.55161 10.8549 6.50544 11.25 7.5 11.25Z" fill="black"/>
</svg>
                                    Présentiel
                                </span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="typeConsultation" value="TELECONSULTATION"
                                    [(ngModel)]="formData.typeConsultation" />
                                <span class="radio-text">
                                    <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                    </svg>
                                    Téléconsultation
                                </span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Observations du médecin -->
            <div class="form-section">
                <div class="section-content">
                    <div class="form-group">
                        <label class="form-label">Observations</label>
                        <textarea class="form-textarea" [(ngModel)]="formData.observations" name="observations"
                            placeholder="Décrivez l'état du patient, les symptômes observés, l'examen clinique..."
                            rows="4"></textarea>
                    </div>
                </div>
            </div>

            <!-- Recommandations -->
            <div class="form-section">
                <div class="section-content">
                    <div class="form-group">
                        <label class="form-label">Recommandations</label>
                        <textarea class="form-textarea" [(ngModel)]="formData.recommandations" name="recommandations"
                            placeholder="Une recommandation par ligne" rows="4"></textarea>
                        <p class="text-xs text-gray-500 mt-1">Séparez chaque recommandation par un tiret (-) ou un
                            retour à la ligne</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Traitements prescrits</label>
                        <textarea class="form-textarea" [(ngModel)]="formData.traitementsPrescrits"
                            name="traitementsPrescrits" placeholder="Un traitement par ligne (nom, dosage, fréquence)"
                            rows="3"></textarea>
                    </div>
                </div>
            </div>

            <!-- Plan de suivi / Prochaines étapes -->
            <div class="form-section">
                <div class="section-content">
                    <div class="form-group">
                        <label class="form-label">Plan de suivi / Prochaines étapes</label>
                        <textarea class="form-textarea" [(ngModel)]="formData.planSuivi" name="planSuivi"
                            placeholder="Ex: Contrôle dans 3 mois" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Examens demandés</label>
                        <textarea class="form-textarea" [(ngModel)]="formData.examens" name="examens"
                            placeholder="Un examen par ligne" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <button type="button" class="btn btn-secondary" (click)="onCancel()">Annuler</button>
            </div>
        </form>

    </div>

</div>
