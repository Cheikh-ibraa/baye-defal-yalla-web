<div>

    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
      <button (click)="annuler()"
        class="w-10 h-10 flex items-center justify-center rounded-lg bg-white shadow-sm hover:bg-gray-50 transition-colors">
        <svg width="16" height="14" viewBox="0 0 14 11" fill="none">
          <path d="M13.157 5.303H.586M.586 5.303L5.3.589M.586 5.303L5.3 10.017"
            stroke="#2B3674" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="text-xl font-bold text-[#1E293B]">Nouveau fournisseur</h1>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">

      <!-- Erreur globale -->
      <div *ngIf="saveError" class="mx-6 mt-5 bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700">
        {{ saveError }}
      </div>

      <!-- Section 1 : Informations générales -->
      <div class="px-6 pt-6 pb-5">
        <div class="flex items-center gap-2 mb-5">
          <div class="w-5 h-5 rounded-full border-2 border-[#1A3C6E] flex items-center justify-center shrink-0">
            <span class="text-[10px] font-bold text-[#1A3C6E]">i</span>
          </div>
          <h2 class="text-sm font-semibold text-[#1E293B]">Informations générales</h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5 sm:col-span-2">
            <label class="text-xs font-medium text-[#6B7280]">Nom de l'entreprise <span class="text-red-500">*</span></label>
            <input type="text" [(ngModel)]="form.nom" placeholder="Ex: Pharma Supplies SARL"
              class="w-full px-3 py-2.5 border border-[#E5E7EB] rounded-lg text-sm text-[#1E293B] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#1A3C6E] focus:border-transparent transition">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-medium text-[#6B7280]">Responsable / Contact</label>
            <input type="text" [(ngModel)]="form.responsable" placeholder="Nom du responsable"
              class="w-full px-3 py-2.5 border border-[#E5E7EB] rounded-lg text-sm text-[#1E293B] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#1A3C6E] focus:border-transparent transition">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-medium text-[#6B7280]">Email <span class="text-red-500">*</span></label>
            <input type="email" [(ngModel)]="form.email" placeholder="contact@fournisseur.sn"
              class="w-full px-3 py-2.5 border border-[#E5E7EB] rounded-lg text-sm text-[#1E293B] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#1A3C6E] focus:border-transparent transition">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-medium text-[#6B7280]">Téléphone</label>
            <input type="tel" [(ngModel)]="form.telephone" placeholder="+221 77 000 00 00"
              class="w-full px-3 py-2.5 border border-[#E5E7EB] rounded-lg text-sm text-[#1E293B] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#1A3C6E] focus:border-transparent transition">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-medium text-[#6B7280]">Type de produits fournis</label>
            <input type="text" [(ngModel)]="form.typeProduits" placeholder="Ex: Médicaments, équipements..."
              class="w-full px-3 py-2.5 border border-[#E5E7EB] rounded-lg text-sm text-[#1E293B] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#1A3C6E] focus:border-transparent transition">
          </div>
        </div>
      </div>

      <hr class="border-[#F1F5F9] mx-6">

      <!-- Section 2 : Adresse -->
      <div class="px-6 py-5">
        <div class="flex items-center gap-2 mb-5">
          <svg class="w-4 h-4 text-[#1A3C6E]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <h2 class="text-sm font-semibold text-[#1E293B]">Adresse</h2>
        </div>
        <div class="space-y-1.5">
          <label class="text-xs font-medium text-[#6B7280]">Adresse complète</label>
          <input type="text" [(ngModel)]="form.adresse" placeholder="Ex: 12 Rue Carnot, Dakar, Sénégal"
            class="w-full px-3 py-2.5 border border-[#E5E7EB] rounded-lg text-sm text-[#1E293B] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#1A3C6E] focus:border-transparent transition">
        </div>
      </div>

      <hr class="border-[#F1F5F9] mx-6">

      <!-- Section 3 : Statut -->
      <div class="px-6 py-5">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-[#1E293B]">Compte actif</p>
            <p class="text-xs text-gray-500 mt-0.5">Le fournisseur pourra se connecter et recevoir des demandes</p>
          </div>
          <button type="button" (click)="form.isActive = !form.isActive"
            [class]="form.isActive ? 'bg-[#1A3C6E]' : 'bg-gray-200'"
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none">
            <span [class]="form.isActive ? 'translate-x-6' : 'translate-x-1'"
              class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow"></span>
          </button>
        </div>
      </div>

      <!-- Boutons -->
      <div class="px-6 pb-6 flex flex-col sm:flex-row gap-3 justify-end">
        <button (click)="annuler()" [disabled]="saving"
          class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50">
          Annuler
        </button>
        <button (click)="enregistrer()" [disabled]="saving"
          class="px-5 py-2.5 text-sm font-medium text-white bg-[#1A3C6E] rounded-lg hover:bg-[#153264] transition-colors disabled:opacity-60 flex items-center gap-2">
          <div *ngIf="saving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>

    </div>
</div>
